<!-- En-tête de navigation -->
<header class="navbar">
  <a [routerLink]="['/']" class="logo-link" title="CHARLY GUITARE - Accueil">
    <div class="logo">
      <span class="logo-text">Charly Guitare</span>
      <span class="logo-icon" aria-hidden="true">🎸</span>
    </div>
  </a>

  <nav class="nav-links" aria-label="Navigation principale">
    <a [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
    <a [routerLink]="['/live']" routerLinkActive="active">Live</a>
    <a [routerLink]="['/academie']" routerLinkActive="active">Academie</a>
    <a [routerLink]="['/abonnement']" routerLinkActive="active">Abonnement</a>
    <a [routerLink]="['/offoland']" routerLinkActive="active">Offoland</a>
  </nav>
  <!-- Si l'utilisateur est connecté -->
<ng-container *ngIf="auth.user$ | async as user; else loggedOut">
  <div class="user-profile">
    <img [src]="user.photoURL" [alt]="user.displayName" class="avatar" />
    <span>{{ user.displayName }}</span>
    <button mat-stroked-button color="warn" (click)="onLogout()">
      <mat-icon>logout</mat-icon> Déconnexion
    </button>
  </div>
</ng-container>

<!-- Si l'utilisateur n'est PAS connecté -->
<ng-template #loggedOut>
  <button mat-raised-button color="primary" (click)="onGoogleLogin()">
    <mat-icon>account_circle</mat-icon> Se connecter avec Google
  </button>
</ng-template>
</header>

<!-- Contenu principal -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
