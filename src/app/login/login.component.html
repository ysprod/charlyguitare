<div class="login-wrapper">
  <!-- Fond décoratif animé -->
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>
  <div class="bg-shape bg-shape-3"></div>

  <div class="login-card">
    <!-- Header -->
    <div class="card-header">
       
      <h2>{{ isSignUp ? 'Créer un compte' : 'Bienvenue' }}</h2>

        <!-- Toggle Mode -->
    <div class="toggle-mode">
      <span *ngIf="!isSignUp">
        Pas encore de compte ?
        <button type="button" class="btn-link-highlight" (click)="toggleMode()">Créer un compte</button>
      </span>
      <span *ngIf="isSignUp">
        Déjà membre ?
        <button type="button" class="btn-link-highlight" (click)="toggleMode()">Se connecter</button>
      </span>
    </div><br/>
      <p class="subtitle">
        {{ isSignUp
            ? 'Rejoignez l\'Académie et commencez votre parcours dès aujourd\'hui.'
            : 'Connectez-vous pour accéder à votre espace personnel.' }}
      </p>
    </div>

   

    <!-- Bannières d'alerte (Erreur & Succès) -->
    <div *ngIf="errorMessage" class="alert-banner error-banner" role="alert" aria-live="polite">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
        <path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="alert-banner success-banner" role="status" aria-live="polite">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 11.08V12a10 10 0 11-5.93-9.14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Bouton Google -->
    <button type="button" class="btn-google" (click)="loginWithGoogle()" [disabled]="loading">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>{{ isSignUp ? 'S\'inscrire avec Google' : 'Continuer avec Google' }}</span>
    </button>

    <div class="divider">
      <span>ou avec votre e-mail</span>
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="handleSubmit()" #loginForm="ngForm" novalidate>
      <div class="form-group">
        <label for="email">Adresse e-mail</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                  stroke="currentColor" stroke-width="2"/>
            <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="votre@email.com"
            autocomplete="email"
            required
            [disabled]="loading"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            [attr.autocomplete]="isSignUp ? 'new-password' : 'current-password'"
            required
            [disabled]="loading"
          />
          <button 
            type="button" 
            class="toggle-pwd" 
            (click)="showPassword = !showPassword" 
            tabindex="-1"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          >
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" stroke="currentColor" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div *ngIf="isSignUp" class="form-group fade-in">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none">
            <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c1.66 0 3.22.45 4.56 1.24"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
            required
            [disabled]="loading"
          />
        </div>
      </div>

      <div *ngIf="!isSignUp" class="forgot-password">
        <button type="button" class="btn-link" (click)="onForgotPassword()" [disabled]="loading">
          Mot de passe oublié ?
        </button>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="!loading" class="btn-content">
          {{ isSignUp ? 'Créer mon compte' : 'Se connecter' }}
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span *ngIf="loading" class="btn-content">
          <span class="spinner" aria-hidden="true"></span>
          Traitement en cours...
        </span>
      </button>
    </form>

   
  </div>
</div>
